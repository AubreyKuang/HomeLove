<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>像素小屋 · HomeLove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Silkscreen&family=DotGothic16&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: full-screen pixel world; wooden-frame UI panels float on top (HUD, dialogue with choices, wardrobe, diary). */
:root{
  --bg:#2a2230;
  --panel:#fff6e6;
  --panel-2:#f5e2c4;
  --wood:#8c5a3c;
  --ink:#3a2a2e;
  --muted:#8b7466;
  --line:#3a2a2e;
  --shadow:#3a2a2e;
  --accent:#e2607a;
  --accent-ink:#ffffff;
  --sel:#ffd45e;
  --sel-ink:#3a2a2e;
  --backdrop:rgba(30,22,34,.55);
  --c-energy:#f2c33a;
  --c-hunger:#ef9a4f;
  --c-mood:#ec6a8a;
  --font-display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#2e2636; --panel-2:#3d3248; --wood:#5e3c2a; --ink:#f5eadc; --muted:#b9a897; --line:#120e16; --shadow:#0c090f;
    --accent:#f07890; --sel:#e9b949; --sel-ink:#2a2026; --backdrop:rgba(8,6,10,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:#2e2636; --panel-2:#3d3248; --wood:#5e3c2a; --ink:#f5eadc; --muted:#b9a897; --line:#120e16; --shadow:#0c090f;
  --accent:#f07890; --sel:#e9b949; --sel-ink:#2a2026; --backdrop:rgba(8,6,10,.65); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#game{position:fixed;inset:0;display:block;touch-action:none;outline:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.px{background:var(--panel);color:var(--ink);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);border-radius:6px}
.pbtn{background:var(--panel);color:var(--ink);border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);border-radius:6px;padding:6px 12px;font-weight:700;font-size:14px;line-height:1.2}
.pbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.pbtn.primary{background:var(--accent);color:var(--accent-ink)}
kbd{display:inline-block;min-width:22px;padding:0 5px;margin-right:6px;border:2px solid var(--line);border-radius:4px;background:var(--sel);color:var(--sel-ink);text-align:center;font-family:"Silkscreen","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:12px;line-height:18px}

#hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:grid;justify-items:start;gap:8px;z-index:5;pointer-events:none;max-width:calc(100% - 210px)}
#hudStats{display:flex;gap:8px;flex-wrap:wrap}
#miniMap{display:block;width:clamp(95px,14vw,144px);padding:3px;pointer-events:auto;text-align:left}
#miniOverview{display:block;width:100%;height:auto;image-rendering:pixelated;border-radius:2px}
#miniRide{display:block;margin:3px 2px 0;font-size:11px;font-weight:700;line-height:1.3}
.chip{background:var(--panel);border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);border-radius:6px;padding:4px 10px;font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.chip .n{font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;gap:3px;font-size:12px}
.bar i{display:block;width:34px;height:10px;border:2px solid var(--line);background:var(--panel-2);border-radius:2px;overflow:hidden}
.bar i b{display:block;height:100%;width:50%}
#bE{background:var(--c-energy)}#bH{background:var(--c-hunger)}#bM{background:var(--c-mood)}
.bar.low i{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{border-color:var(--accent);background:var(--accent)}}
#hudR{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:5;flex-wrap:wrap;justify-content:flex-end;max-width:280px}
@media(max-width:560px){#hud{max-width:46vw;gap:6px}#hudStats{gap:5px}#hudR{max-width:48vw}#hudR .pbtn{padding:4px 6px;font-size:12px}}

#prompt{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:7;padding:6px 12px;font-size:14px;font-weight:700;white-space:nowrap}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#dialog{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 32px));z-index:8;padding:10px 14px 14px;cursor:pointer;max-height:calc(100% - 120px);overflow:auto}
#dialog.modal{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#dialog .who{font-family:var(--font-display);font-size:16px;color:var(--accent);margin-bottom:2px}
#dialog .txt{font-size:15px;line-height:1.65}
#dialog .more{position:absolute;right:12px;bottom:4px;font-size:12px;color:var(--muted);animation:bob .8s steps(2) infinite}
@keyframes bob{50%{transform:translateY(2px)}}
.weekMeter{grid-column:1/-1;display:block;width:min(100%,260px);height:15px;border:2px solid #664753;background:#9f727b;position:relative;overflow:hidden}
.weekMeter::before{content:"";position:absolute;inset:0 auto 0 40%;width:20%;background:#729c75}
.weekMeter i{position:absolute;inset:0 auto 0 0;width:3px;background:#fff6df;animation:weekShot 1.35s linear infinite alternate}
@keyframes weekShot{to{left:calc(100% - 3px)}}
@media(prefers-reduced-motion:reduce){.weekMeter i{animation:none;left:50%}}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:6px;margin-top:10px}
.choice{display:flex;align-items:center;gap:6px;text-align:left;background:var(--panel-2);color:var(--ink);border:3px solid var(--line);border-radius:6px;padding:6px 10px;font-weight:700;font-size:14px;min-width:0}
.choice:hover:not(:disabled),.choice:focus-visible{background:var(--sel);color:var(--sel-ink);outline:none}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice kbd{margin:0;flex:none}

#pad{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;touch-action:none}
#pad button{background:var(--panel);border:3px solid var(--line);border-radius:8px;box-shadow:3px 3px 0 var(--shadow);font-size:18px;font-weight:900;touch-action:none;padding:0}
#pad button.on{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow);background:var(--sel);color:var(--sel-ink)}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .r{grid-column:3;grid-row:2}#pad .d{grid-column:2;grid-row:3}
#abtn{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:74px;height:74px;border-radius:50%;z-index:6;display:none;font-family:"Silkscreen",monospace;font-size:24px;background:var(--accent);color:var(--accent-ink);border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);touch-action:none}
#abtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
@media (pointer:coarse){
  #pad{display:grid}#abtn{display:block}
  #prompt{bottom:calc(196px + env(safe-area-inset-bottom,0px))}
  #dialog,#dialog.modal{bottom:auto;top:calc(104px + env(safe-area-inset-top,0px));max-height:calc(100% - 330px)}
}

.overlay{position:fixed;inset:0;z-index:20;background:var(--backdrop);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
.dpanel{width:min(940px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;border-width:4px}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px 8px 16px;background:var(--wood);color:#fff3df;border-bottom:4px solid var(--line)}
.dhead h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.04em}
.dhead small{font-size:12px;opacity:.85;margin-left:8px}
.dbody{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:0;flex:1}
.stage{padding:14px;border-right:3px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:12px;overflow:auto;background:var(--panel)}
.stagebox{width:100%;height:236px;display:flex;justify-content:center;align-items:flex-end;padding-bottom:14px;border:3px solid var(--line);border-radius:6px;position:relative;
  background-color:var(--panel-2);
  background-image:linear-gradient(45deg,rgba(120,80,60,.08) 25%,transparent 25%,transparent 75%,rgba(120,80,60,.08) 75%),linear-gradient(45deg,rgba(120,80,60,.08) 25%,transparent 25%,transparent 75%,rgba(120,80,60,.08) 75%);
  background-size:16px 16px;background-position:0 0,8px 8px}
.stagebox::after{content:"";position:absolute;left:50%;bottom:14px;width:96px;height:12px;transform:translateX(-50%);background:rgba(58,42,46,.18);border-radius:50%}
#preview{width:160px;height:208px;position:relative;z-index:1}
#preview.pop{animation:pop .28s steps(4)}
@keyframes pop{0%{transform:translateY(0)}40%{transform:translateY(-10px)}100%{transform:translateY(0)}}
.stagectl{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
.rot{display:flex;align-items:center;gap:8px}
.rot span{min-width:44px;text-align:center;font-weight:700;font-size:13px}
.rot .pbtn{padding:4px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.looksWrap{width:100%}
.lbl{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.08em;margin:0 0 6px}
.looks{display:flex;flex-wrap:wrap;gap:10px}
.looks .empty{font-size:12px;color:var(--muted);line-height:1.5}
.look{position:relative;border:3px solid var(--line);border-radius:6px;background:var(--panel-2);padding:2px}
.look canvas{width:40px;height:52px;display:block}
.look .del{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:11px;line-height:14px;padding:0;font-weight:900}
.picker{display:flex;flex-direction:column;min-height:0;padding:12px 14px 14px;gap:12px;background:var(--panel)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 12px;border:3px solid var(--line);border-radius:6px;background:var(--panel-2);font-weight:700;font-size:14px}
.tab.on{background:var(--sel);color:var(--sel-ink);box-shadow:3px 3px 0 var(--shadow)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;overflow:auto;min-height:120px;flex:1;padding:2px 6px 6px 2px;align-content:start}
.item{border:3px solid var(--line);border-radius:6px;background:var(--panel-2);padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.item canvas{width:64px;height:56px}
.items[data-category="capsuleHair"] .item canvas{width:54px;height:63px}
.item span{font-size:12px;font-weight:700}
.item.sel{background:var(--sel);color:var(--sel-ink);box-shadow:3px 3px 0 var(--shadow)}
.item.locked canvas{filter:grayscale(1);opacity:.45}
.item .lock{position:absolute;top:3px;right:5px;font-size:11px;font-weight:800;color:var(--accent)}
.item .liked{position:absolute;top:3px;left:5px;font-size:11px;color:var(--accent)}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border:3px solid var(--line);border-radius:6px;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--sel),3px 3px 0 3px var(--shadow)}

.village-panel{width:min(720px,100%)}
.village-body{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start;padding:14px;overflow:auto}
#villageOverview{width:100%;height:auto;image-rendering:pixelated;border:3px solid var(--line);border-radius:6px}
#villageStops{display:grid;gap:6px}
.village-stop{display:flex;align-items:center;gap:8px;text-align:left}
.village-stop small{display:block;font-weight:500;color:var(--muted)}
.village-dot{width:10px;height:10px;flex:0 0 10px;border:1px solid var(--line)}
@media(max-width:520px){.village-body{grid-template-columns:1fr}.village-panel{height:auto;max-height:90vh}#villageOverview{max-height:34vh;object-fit:contain}}
.diarypanel{width:min(860px,100%)}
#btnAlbum{position:relative}
#btnAlbum[data-new]::after{content:attr(data-new);position:absolute;top:-7px;right:-5px;padding:1px 4px;color:#fff9eb;background:#a55356;border:2px solid #fff1d5;font-size:10px;line-height:1.2;pointer-events:none}
.album-body{overflow:auto;padding:16px;background:#f5e3c7;color:#513b33}
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,145px),1fr));gap:14px}
.album-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.album-card,.album-page{background:#fff5df;border:2px solid #b48667;color:#513b33;padding:8px;box-shadow:2px 3px #d7b595}
.album-card{display:flex;flex-direction:column;gap:4px;text-align:start;font:inherit;cursor:pointer}
.album-card:hover,.album-card:focus-visible{border-color:#a55356}
.album-card[data-kind="rareDate"]{border-color:#b48537}
.album-card canvas,.album-page canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border:1px solid #ac8063}
.album-card small,.album-page small{color:#75594a}
.album-page>.pbtn{margin-top:8px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,128px),1fr));gap:10px;margin-top:8px}
.badge{display:grid;justify-items:center;gap:4px;text-align:center;background:#fff5df;border:2px solid #b48667;color:#513b33;padding:8px;box-shadow:2px 3px #d7b595}
.badge canvas{width:48px;height:48px;image-rendering:pixelated}
.badge small{color:#75594a;font-size:11px}
.badge.locked{opacity:.6}
.badge.rare:not(.locked){background:linear-gradient(160deg,#fff4d2,#f1d9a8);border-color:#c9a258}
.badge .pbtn{font-size:12px;padding:3px 8px}
.rewind-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.album-page{width:min(100%,436px);margin:12px auto 4px;padding:12px}
.album-page h3{margin:10px 0 2px}
.album-page p{margin:8px 0 2px}
.diarybody{overflow:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:18px;background:var(--panel)}
.dsec h3{margin:0 0 10px;font-family:var(--font-display);font-weight:400;font-size:19px}
.rel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:12px}
.rcard{display:flex;gap:12px;padding:12px;border:3px solid var(--line);border-radius:6px;background:var(--panel-2)}
.rcard canvas{width:60px;height:78px;flex:none}
.rinfo{min-width:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.rtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rtop b{font-size:16px}
.pill{font-size:11px;font-weight:800;padding:1px 8px;border:2px solid var(--line);border-radius:999px;background:var(--panel)}
.pill.love{background:var(--accent);color:var(--accent-ink)}
.rsub{color:var(--muted);font-size:12px}
.hearts{display:flex;gap:2px;font-size:15px;line-height:1;color:var(--muted)}
.hearts span{opacity:.3}.hearts span.on{color:var(--accent);opacity:1}
.rline{line-height:1.55}
.rline em{font-style:normal;color:var(--muted)}
.rnext{margin-top:2px;font-weight:700;color:var(--accent)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.icard{display:flex;gap:10px;align-items:center;padding:10px;border:3px solid var(--line);border-radius:6px;background:var(--panel-2)}
.icard .ic{font-size:24px}
.icard b{display:block;font-size:14px}
.icard small{color:var(--muted);font-size:12px;line-height:1.4;display:block}
.tips{margin:0;padding-left:18px;line-height:1.85;font-size:13px}

.card{width:min(480px,100%);padding:22px 22px 20px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.card h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:34px;letter-spacing:.04em;text-wrap:balance}
.card p{margin:0;line-height:1.7;font-size:15px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:14px;align-items:center}
.keys .k{display:flex;gap:4px}
.keys kbd{margin:0}
.card .pbtn{align-self:flex-start;font-size:16px;padding:8px 18px}
#fade{position:fixed;inset:0;background:#0d0a12;opacity:0;pointer-events:none;transition:opacity .45s;z-index:40}

.langpick{display:flex;gap:6px;flex-wrap:wrap}
.langpick .pbtn{padding:4px 10px;font-size:13px}
.langpick .pbtn[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
#btnLang{white-space:nowrap}
@media (max-width:720px){
  .overlay{padding:0}
  .dpanel{height:100%;width:100%;border-radius:0;border:0;box-shadow:none}
  .dhead{padding-top:calc(8px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .dhead small{display:none}
  .dbody{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .stage{border-right:0;border-bottom:3px solid var(--line);flex-direction:row;align-items:stretch;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));overflow:visible}
  .stagebox{width:118px;flex:none;height:156px;padding-bottom:8px}
  .stagebox::after{bottom:8px;width:70px}
  #preview{width:100px;height:130px}
  .stagectl{align-items:flex-start;gap:8px;min-width:0}
  .row{justify-content:flex-start}
  .looksWrap{display:none}
  .picker{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .items{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
  .item canvas{width:56px;height:49px}
  .diarybody{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .card{margin:16px}
}
@media (prefers-reduced-motion:reduce){#preview.pop,.bar.low i,#dialog .more{animation:none}#fade{transition:none}}

.keepsakes{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.keepsake{display:flex;align-items:center;gap:6px;min-height:45px;padding:4px 7px;border:1px solid #ac745d;background:#fff0cc;color:#633f36;box-shadow:2px 2px 0 #d8a679;border-radius:3px}
.keepsake[data-kind="rareDate"]{border-color:#ac84b8;background:#f4e4ff;box-shadow:2px 2px 0 #c49ccc}
.keepsake[data-kind="sharedFishing"]{border-color:#7397a9;background:#e5f4fb;box-shadow:2px 2px 0 #a8c7d4}
.keepsake canvas{width:30px;height:39px;image-rendering:pixelated}
.keepsake-caption{display:grid;gap:1px;font-size:11px}
.keepsake-caption small{font-size:10px}
.capsule-reveal{display:grid;place-items:center;margin:4px auto 8px;width:88px;height:104px;border:2px solid #b87983;background:#fce1d4;box-shadow:3px 3px 0 #d1a18a;border-radius:8px}
.capsule-reveal canvas{width:60px;height:78px;image-rendering:pixelated}
</style>
</head>
<body>

<canvas id="game" tabindex="0" data-i18n-aria="title"></canvas>

<div id="hud">
  <div id="hudStats">
  <div class="chip" id="chipTime">☀️</div>

/* Everything is synthesized with Web Audio: a soft music-box tune over warm pads, plus small sound effects. */
const SND_KEY='homelove-sound';
let sndOn=(()=>{try{return localStorage.getItem(SND_KEY)!=='off';}catch(e){return true;}})();
let AC=null,master=null,musicBus=null,sfxBus=null,musicTimer=0,NB=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function audioInit(){
  if(AC)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{AC=new C();}catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=sndOn?1:0;master.connect(AC.destination);
  musicBus=AC.createGain();musicBus.gain.value=0.5;sfxBus=AC.createGain();sfxBus.gain.value=0.8;
  const delay=AC.createDelay(1),fb=AC.createGain(),lp=AC.createBiquadFilter(),wet=AC.createGain();
  delay.delayTime.value=0.36;fb.gain.value=0.3;lp.type='lowpass';lp.frequency.value=2000;wet.gain.value=0.4;
  musicBus.connect(master);musicBus.connect(delay);delay.connect(lp);lp.connect(fb);fb.connect(delay);lp.connect(wet);wet.connect(master);
  sfxBus.connect(master);
  startMusic();
}
function tone(f,t,dur,o){
  o=o||{};const osc=AC.createOscillator(),g=AC.createGain(),vol=o.vol||0.1,a=o.attack||0.008;
  osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);if(o.glide)osc.frequency.exponentialRampToValueAtTime(o.glide,t+dur*0.9);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g);g.connect(o.bus||sfxBus);osc.start(t);osc.stop(t+dur+0.05);
}
function noise(t,dur,o){
  o=o||{};
  if(!NB){NB=AC.createBuffer(1,Math.floor(AC.sampleRate*1.5),AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();

function bell(f,t,vol,bus){vol=vol||0.12;tone(f,t,1.4,{vol,bus});tone(f*2,t,0.5,{vol:vol*0.25,bus});tone(f*3.01,t,0.22,{vol:vol*0.08,bus});}

/* music: IV - iii - ii - I in C, a wandering pentatonic music-box line; slower and lower at night */
const CHORDS=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]];
const PENTA=[60,62,64,67,69,72,74,76,79,81,84];
let mNext=0,mStep=0,mPrev=72,mNight=false;
function startMusic(){mNext=AC.currentTime+0.4;mStep=0;clearInterval(musicTimer);musicTimer=setInterval(schedMusic,120);}
function schedMusic(){
  if(!AC||AC.state!=='running'||!sndOn)return;
  if(mNext<AC.currentTime)mNext=AC.currentTime+0.05;
  while(mNext<AC.currentTime+0.6){
    const pos=mStep%8,ch=CHORDS[Math.floor(mStep/8)%4];
    if(pos===0)mNight=darkness()>0.5;
    const e=mNight?0.52:0.42,t=mNext,sh=mNight?-12:0;
    if(pos===0){
      ch.forEach((m,i)=>tone(mtof(m+sh),t+i*0.04,e*8.3,{type:'triangle',vol:mNight?0.028:0.036,bus:musicBus,attack:0.9}));
      tone(mtof(ch[0]-12),t,e*3.6,{vol:0.11,bus:musicBus,attack:0.03});
    }
    if(pos===4)tone(mtof(ch[0]-5),t,e*3.6,{vol:0.07,bus:musicBus,attack:0.03});
    if(Math.random()<(mNight?0.3:0.5)&&!(pos%2&&Math.random()<0.45)){
      let m;
      if(pos===0){const ct=ch.map(x=>x+24).filter(x=>x>=60&&x<=84);m=ct.reduce((a,b)=>Math.abs(b-mPrev)<Math.abs(a-mPrev)?b:a);}
      else{const near=PENTA.filter(x=>x!==mPrev&&Math.abs(x-mPrev)<=5);m=pick(near.length?near:PENTA);}
      mPrev=m;bell(mtof(m+sh),t,mNight?0.06:0.075,musicBus);
    }
    if(mNight&&Math.random()<0.05)tone(mtof(96+pick([0,2,4,7])),t,1.6,{vol:0.02,bus:musicBus});
    mNext+=e;mStep++;
  }
}

      if(rnd()<.1){const a=rnd()*13|0,b=rnd()*13|0;R(px+a,py+b,1,1,'#fffbe8');R(px+a+2,py+b+1,1,1,'#ffe08a');}

    else if(p.moving){p.still=(p.still||0)+dt;if(p.still>0.3)p.moving=false;else p.anim=(p.anim||0)+dt;}
  }
}

function drawCapsule(pool,payment){
  const owned=state[pool.owned],remaining=pool.items.filter(item=>!unlocked(item));
  if(!remaining.length)return;
  const free=firstCapsule(),cost=free?0:CAPSULE_COST[payment];
  if(!free){
    if(!Object.hasOwn(CAPSULE_COST,payment)||state.inv[payment]<CAPSULE_COST[payment])return;
    state.inv[payment]-=cost;
  }
  const item=pick(remaining);
  owned.push(item.id);
  if(!save()){
    owned.pop();
    if(cost)state.inv[payment]+=cost;
    talk(objName('capsule'),[lifeText('存档失败，扭蛋没有扣材料。请检查浏览器的存储设置。','The draw could not be saved. Your items were returned. Check browser storage.','保存できなかったため、材料を戻しました。ブラウザのストレージ設定を確認してください。')]);
    return;

  updateHud();sfx('levelup');
  const preview=el('div','capsule-reveal'),sprite=mk(20,26);
  preview.setAttribute('aria-hidden','true');
  blitChar(sprite.getContext('2d'),capsuleOutfit(pool,item),'down',0,0,0);
  preview.append(sprite);

    {label:tr(pool.slot==='hair'?'capsuleTryHair':'capsuleTry'),fn:()=>tryCapsuleItem(pool,item)},
    {label:tr('capsuleView'),back:true,fn:()=>openCapsuleWardrobe(pool)}
  ];

    const complete=owned.length===pool.items.length;
    options.push({label:tr(complete?'capsuleNoMore':'capsuleAgain'),disabled:complete,fn:()=>capsulePoolMenu(pool)});
  }
  talk(objName('capsule'),[tr('capsuleWon',{dress:itemName(item.id)})],options,null,preview);

function tendPlot(i){
  const plot=state.garden[i];
  if(CottageActivities.ripe(plot)){
    if(plot.crop==='mysteryBloom'){bloomMenu(i);return;}
    const crop=CottageActivities.pickCrop(state.garden,i);
    state.inv[crop]++;
    sfx('pickup');save();updateHud();
    say(tr('farm'),tr('cropPicked',{crop:itemLabel(crop),count:state.inv[crop]}));
    return;
  }
  const opts=[];
  const season=CottageActivities.seasonOf(state.day),tunnels=state.tunnels||[];
  const warm=CottageActivities.canGrow(season,tunnels,i);
  const cost=CottageActivities.tunnelCost.shell;
  let line=tr('plantTip');
  if(!warm)line=tr('winterPlotTip');
  else if(!plot){
    for(const [crop,{days,event}] of Object.entries(CottageActivities.crops)){
      if(event)continue;
      opts.push({label:tr('plantOption',{crop:itemLabel(crop),days}),fn:()=>{
        state.garden[i]=CottageActivities.seed(crop);
        sfx('pickup');save();
        say(tr('farm'),tr('cropPlanted',{crop:itemLabel(crop)}));
      }});
    }
    const event=state.events&&seedPlantOption(i);
    if(event)opts.unshift(event);
  }else{
    const days=CottageActivities.crops[plot.crop].days-plot.growth;
    line=tr(plot.watered?'cropWet':'cropDry',{crop:itemLabel(plot.crop),days});
    const dry=state.garden.filter((p,index)=>p&&!p.watered&&!CottageActivities.ripe(p)&&CottageActivities.canGrow(season,tunnels,index));
    if(!plot.watered)opts.push({label:tr('waterPlot'),fn:()=>waterPlots([plot])});
    if(dry.length>1||(plot.watered&&dry.length))opts.push({label:tr('waterGarden',{count:dry.length}),fn:()=>waterPlots(dry)});
    opts.push({label:tr('clearPlot'),fn:()=>talk(tr('farm'),[tr('clearPlotAsk',{crop:itemLabel(plot.crop)})],[
      {label:tr('clearPlot'),fn:()=>{state.garden[i]=null;save();}},
      {label:tr('optBack'),back:true,fn:()=>tendPlot(i)}
    ])});
  }
  if(state.tunnels&&!tunnels.includes(i)){
    if(tunnels.length<CottageActivities.tunnelLimit){
      opts.push({label:tr('winterBuild',{cost}),disabled:state.inv.shell<cost,fn:()=>{
        if(!CottageActivities.installTunnel(tunnels,i,state.inv))return;
        sfx('ding');save();updateHud();tendPlot(i);
      }});
    }else if(!warm)line=tr('winterPlotLimit');
  }
  if(tunnels.includes(i))line=tr('winterCovered')+' '+line;
  talk(tr('farm'),[line],opts.concat({label:tr('walkAway'),fn:null}));
}

const FISH={on:false,phase:'',t:0,tx:0,ty:0,bait:false,night:false,spot:'reeds',window:0,companion:null,snow:null};
const actKey=()=>isTouch?'A':'E';
const pondSpot=tx=>tx<22?'reeds':'openWater';
function queueFishingInvitation(n,giftDay=state.day){
  const life=lifeOf(n);
  life.fishingInvitation ||= {dueDay:giftDay+FISHING_INVITE.delay};
}
function fishingInvitationReady(n){
  const invitation=state.life[n.id]?.fishingInvitation;
  return !!invitation&&!invitation.catch&&state.day>=invitation.dueDay&&
    state.time>=FISHING_INVITE.opens&&state.time<FISHING_INVITE.closes;
}
function seekFishingInvitation(n){
  const px=Math.floor(P.x/16),py=Math.floor((P.y-2)/16);
  if(!npcPassable(px,py,rel(n).livesIn||summoned(n)))return false;
  const now=absMin();
  if(now>=n.invitationPathAt&&now-n.invitationPathAt<3)return false;
  n.invitationPathAt=now;
  npcGo(n,px,py);
  if(n.path&&n.path.length<=3&&Math.hypot(n.x-P.x,n.y-P.y)<43){
    offerFishingInvitation(n);
    return true;
  }
  // Leave one tile between the two characters as the resident walks up.
  if(n.path?.length>1)n.path.pop();
  return false;
}
function offerFishingInvitation(n){
  n.path=null;n.idle=12;n.seekingPlayer=false;n.moving=false;
  rel(n).done.visit=true;
  D.npc=n;
  talk(nm(n),[tr('sharedFishingInvite')],[
    {label:tr('sharedFishingAccept'),disabled:state.need.energy<5,fn:()=>goFishingTogether(n)},
    {label:tr('sharedFishingLater'),back:true,fn:()=>deferFishingInvitation(n)}
  ]);
}
function deferFishingInvitation(n){
  lifeOf(n).fishingInvitation.dueDay=state.day+1;
  save();
  say(nm(n),tr('sharedFishingDeferred'));
}
function goFishingTogether(n){
  D.npc=n;
  busyFade(()=>{
    Object.assign(P,{x:23*16+8,y:7*16+12,dir:'up'});
    Object.assign(n,{x:22*16+8,y:7*16+12,dir:'up',state:'here',path:null,
      leaving:false,working:null,moving:false,idle:30});

  },()=>startFish(23,6,false,n));

function startFish(tx,ty,bait,companion=null){
  if(FISH.on||state.need.energy<5||(bait&&state.inv.berry<1))return;
  const winter=CottageActivities.seasonOf(state.day)==='winter';
  if(winter&&!isIceHole(tx,ty))return;

function reel(){
  if(!FISH.on)return;
  if(FISH.snow){snowBite();return;}
  if(FISH.phase==='bite'){
    const companion=FISH.companion;
    const rolled=CottageActivities.rollCatch(FISH.spot,FISH.night,FISH.bait,Math.random());
    const k=companion&&!Object.hasOwn(CottageActivities.fish,rolled)?'fish':rolled;
    const result=CottageActivities.logFish(state.fishLog,k,state.day,Math.random());
    const i=`${ITEM_ICONS[k]} ${itemLabel(k)}`;
    if(companion){
      const caught={day:state.day,time:Math.floor(state.time),kind:k,size:result.size};
      lifeOf(companion).fishingInvitation.catch=caught;
      rememberPlayer(companion,'sharedFishing','caught',1,95,caught);
      state.need.mood=clampN(state.need.mood+8);
    }
    const bottle=!companion&&state.events&&CottageEvents.discover(state.events,'bottle',state.day,Math.random());
    sfx('catch');state.inv[k]++;endFish(15,3);heart(P.x,P.y-26);
    if(companion){
      D.npc=companion;
      talk(nm(companion),[tr('sharedFishingCaught',{i,size:result.size})]);
    }else if(bottle){
      talk(tr('pond'),[tr('worldBottleFound',{item:i})]);
    }else{
      say(tr('pond'),result?tr(result.record?'fishRecord':'fishSized',{i,size:result.size}):tr('fishGot',{i})+(k==='star'?' '+tr('fishRare'):''));
    }
  }else missFish('fishEarly');
}
function endFish(min,e){
  FISH.on=false;FISH.companion=null;FISH.snow=null;
  advanceTime(min);state.need.energy=clampN(state.need.energy-e);
  updateHud();save();
}
function missFish(reason){
  const {companion,tx,ty}=FISH;
  sfx('miss');endFish(10,2);
  if(!companion){say(tr('pond'),tr(reason));return;}
  D.npc=companion;
  talk(nm(companion),[tr(reason)],[
    {label:tr('sharedFishingRetry'),disabled:state.need.energy<5||state.time>=FISHING_INVITE.closes,
      fn:()=>startFish(tx,ty,false,companion)},
    {label:tr('sharedFishingLater'),back:true,fn:()=>deferFishingInvitation(companion)}
  ]);
}
function cancelFishing(){
  if(FISH.snow){
    endFish(5,1);say(nm(snowResident()),tr('snowStop'));return;
  }
  const companion=FISH.companion;
  FISH.on=false;FISH.companion=null;
  if(companion)deferFishingInvitation(companion);
  else say(tr('pond'),tr('fishStop'));
}
function updFish(dt){
  if(!FISH.on)return;
  if(FISH.snow){
    updateSnowFishing(dt);
    if(!FISH.on||FISH.phase==='snowWait')return;
  }
  FISH.t-=dt;
  if(FISH.phase==='wait'&&FISH.t<=0){
    sfx('bite');FISH.phase='bite';FISH.window=(isTouch?2.2:1.8)+(FISH.bait||FISH.companion ? .5 : 0);FISH.t=FISH.window;
    say(tr('pond'),tr('fishBite',{k:actKey()}),60000);
  }
  else if(FISH.phase==='bite'&&FISH.t<=0){if(FISH.snow)snowRecast();else missFish('fishGone');}
}

function snowRecords(){
  const {stats}=state.snowFishing;
  if(!stats.last)return;
  D.npc=snowResident();
  talk(nm(D.npc),[tr('snowRace_'+stats.last.outcome),snowRaceSummary(stats.last),
    tr('snowRaceTotals',{won:stats.won,lost:stats.lost,tie:stats.tie}),
    tr('snowRaceBest',{player:stats.best===null?tr('snowNoCatch'):tr('snowSeconds',{seconds:stats.best.toFixed(1)}),
      rival:tr('snowSeconds',{seconds:stats.rivalBest.toFixed(1)})})]);
}
function openSnowFishing(knock=false){
  const event=state.snowFishing;
  if(!event.invited||CottageActivities.seasonOf(state.day)!=='winter')return;
  const n=snowResident();
  const opts=[{label:tr(event.stats.last?'snowRematch':'snowRace'),disabled:state.need.energy<5,fn:()=>beginSnowFishing('race')}];
  if(!event.ready&&!event.dinner)opts.push({label:tr('snowCoop'),disabled:state.need.energy<5,fn:()=>beginSnowFishing('coop')});
  if(event.stats.last)opts.push({label:tr('snowRecords'),fn:snowRecords});
  opts.push({label:tr('snowLater'),back:true,fn:null});
  D.npc=n;
  talk(nm(n),[tr(knock?'snowKnock':'snowReturn')],opts);
}
function beginSnowFishing(mode){
  const event=state.snowFishing;
  if(state.need.energy<5||CottageActivities.seasonOf(state.day)!=='winter'||
      (mode==='coop'&&(event.ready||event.dinner)))return;
  const n=snowResident();
  rel(n).met=true;
  busyFade(()=>{
    Object.assign(P,{x:23*16+8,y:7*16+12,dir:'up'});
    placeSnowResident(n,19,7,'up');snapPets();save();
  },()=>{
    startFish(23,6,false);
    if(!FISH.on)return;
    FISH.snow=SnowFishing.start(mode,Math.random());
    FISH.t=1.6+Math.random()*1.1;
    say(nm(n),tr(mode==='race'?'snowRaceStart':'snowCoopStart',{k:actKey()}),60000);
  });
}
function snowBite(){
  const round=FISH.snow;
  if(round.player!==null)return;
  if(FISH.phase!=='bite'){snowRecast();return;}
  round.player=round.elapsed;
  round.kind=CottageActivities.rollCatch('ice',false,false,Math.random());
  if(!Object.hasOwn(CottageActivities.fish,round.kind))round.kind='fish';
  FISH.phase='snowWait';
  sfx('catch');
  say(nm(snowResident()),tr('snowYourCatch'),60000);
  updateSnowFishing(0);
}
function snowRecast(){
  FISH.phase='wait';FISH.t=1.3+Math.random()*.8;
  sfx('cast');say(nm(snowResident()),tr('snowRecast',{k:actKey()}),60000);
}
function updateSnowFishing(dt){
  const round=FISH.snow,previous=round.elapsed;
  round.elapsed+=dt;
  if(previous<round.rival&&round.elapsed>=round.rival&&round.player===null)
    notify(tr(round.mode==='race'?'snowRivalCatch':'snowRivalIngredient'));
  if(round.mode==='race'){
    if(!SnowFishing.raceReady(round))return;
    if(round.kind){
      state.inv[round.kind]++;
      CottageActivities.logFish(state.fishLog,round.kind,state.day,Math.random());
    }
    const last=SnowFishing.record(state.snowFishing,state.day,round);
    endFish(15,3);
    D.npc=snowResident();
    talk(nm(D.npc),[tr('snowRace_'+last.outcome),snowRaceSummary(last)],[
      {label:tr('snowRematch'),disabled:state.need.energy<5,fn:()=>beginSnowFishing('race')},
      {label:tr('snowRecords'),fn:snowRecords},
      {label:tr('snowLater'),back:true,fn:null}
    ]);
    return;
  }
  if(round.player===null||round.elapsed<round.rival)return;
  const {kind}=round;
  CottageActivities.logFish(state.fishLog,kind,state.day,Math.random());
  state.snowFishing.ready=state.day;
  endFish(15,3);
  D.npc=snowResident();
  talk(nm(D.npc),[tr('snowDinnerReady')],[
    {label:tr('snowGoDinner'),fn:eatSnowDinner},
    {label:tr('snowDinnerLater'),back:true,fn:null}
  ]);
}
function eatSnowDinner(){
  const event=state.snowFishing;
  if(!event.ready||event.dinner)return;
  const n=snowResident(),host=snowHost();
  snowDining=true;
  busyFade(()=>{
    state.time=Math.max(state.time,SnowFishing.supperTime);
    Object.assign(P,{x:7*16+8,y:7*16+12,dir:'up'});
    placeSnowResident(n,5,6,'right');placeSnowResident(host,8,6,'left');
    snapPets();sfx('eat');
    event.dinner=state.day;
    state.need.hunger=clampN(state.need.hunger+50);
    state.need.mood=clampN(state.need.mood+12);
    for(const person of [n,host]){
      rel(person).met=true;
      rememberPlayer(person,'snowDinner','completed',.8,82,'fish');
    }
    save();updateHud();
  },()=>{
    D.npc=n;
    talk(nm(n),[tr('snowDinnerMeal'),tr('snowDinnerConfession'),tr('snowDinnerToast')],null,()=>{snowDining=false;});
  });
}

function memoryLine(n,entry){
  const data=entry.interpretation;
  if(!data||typeof data!=='object')return '';
  if(data.type==='riverApron'||data.type==='riverLetter')return tr(data.type+'Recall');
  if(data.type==='xiaomanConfession'&&data.object==='friends')return tr('xmRecallFriends');
  if(['worldUfo','worldBottle','worldSeed'].includes(data.type))return tr(data.type+'Recall_'+data.object);
  if(data.type==='neighborRequest')return tr('requestRecall_'+n.id,{item:itemLabel(data.object)});
  if(data.type==='sharedFishing')return tr('sharedFishingRecall',{
    fish:itemLabel(data.object.kind),size:data.object.size
  });
  const where=Lp.dates[data.object]?.name||data.object;
  const copy={
    zh:{date:'还记得我们第一次约会吗？',gift:'你送我的礼物，我还记得。',birthday:'谢谢你记得我的生日。',visit:'那天我生病，你来看我，我很开心。',rival:'那天看到你和别人约会，我心里还有点难过。'},
    en:{date:'I still remember our first date.',gift:'I remember your gift.',birthday:'Thank you for remembering my birthday.',visit:'I was glad you visited when I was sick.',rival:'It still stings to remember that date I saw.'},
    ja:{date:'初めてのデート、今も覚えているよ。',gift:'プレゼント、今も覚えているよ。',birthday:'誕生日を覚えていてくれてありがとう。',visit:'お見舞いに来てくれてうれしかった。',rival:'あの日のことを思い出すと、まだ少しつらい。'}
  }[LANG]||{};
  if(data.outcome==='missed'){
    if(data.type==='birthday')return lifeText('那天是我的生日，我本来以为你会记得。','I had hoped you would remember my birthday.','誕生日を覚えていてくれると思っていたよ。');
    if(data.type==='visit')return lifeText('那几天不舒服，有点想见你。','I missed you while I was sick.','具合が悪かったとき、会いたかったよ。');
  }
  const line=copy[data.type]||'';
  const detail=data.type==='date'?where:data.type==='gift'?itemLabel(data.object):'';
  return line&&detail?line+' '+detail:line;
}

function greetDropIn(n){
  const drop=CottageBonds.meetDropIn(B());if(!drop)return;
  n.path=null;n.idle=20;n.seekingPlayer=false;rel(n).done.visit=true;D.npc=n;
  const lines=[tr('dropIn_'+drop.reason)];let after=()=>{};
  if(drop.reason==='gift'){const k=pick(GIFT_KEYS);state.inv[k]=(state.inv[k]||0)+1;lines.push(tr('dropInGift',{n:nm(n),i:ITEM_ICONS[k]+itemLabel(k)}));updateHud();}
  if(drop.reason==='help')after=()=>{advanceTime(20);notify(tr('dropInHelp',{n:nm(n)}));trustNpc(n,6);};
  rememberPlayer(n,'dropIn','completed',.5,70,drop.reason);
  trustNpc(n,3);
  CottageBonds.unlock(B(),'dropIn',state.day);
  if(drop.reason==='jealous'&&B().heard[n.id]){talk(nm(n),lines,null,()=>confront(n,null));save();return;}
  talk(nm(n),lines,null,()=>{after();addPts(n,drop.reason==='missYou'?4:2);});

// Courting two people at once gets around. The one who heard asks you about it.
function confront(n,next){
  const rival=npcs.find(m=>m.id===B().heard[n.id]);
  if(!rival){CottageBonds.answer(B(),n.id,'soothe');if(next)next();return;}
  const r=nm(rival),trusting=B().trust[n.id]>=15;D.npc=n;
  const reply=(how,text,pts)=>()=>{
    CottageBonds.answer(B(),n.id,how);
    if(how==='honest')CottageBonds.unlock(B(),'honest',state.day);
    rememberPlayer(n,'confront',how,how==='honest'?.1:how==='soothe'?-.1:-.5,80,rival.id);
    D.npc=n;talk(nm(n),[text],null,()=>{if(pts)addPts(n,pts);save();if(next)next();});
  };
  talk(nm(n),[tr('confrontQ',{r})],[
    {label:tr('confrontHonest',{r}),fn:reply('honest',tr('confrontHonestReply'),-2)},
    {label:tr('confrontSoothe'),fn:reply('soothe',trusting?tr('confrontSootheReply'):tr('confrontSootheDoubt'),trusting?0:-2)},
    {label:tr('confrontAvoid'),fn:reply('avoid',tr('confrontAvoidReply'),-4)}]);
}

// Rare: a shooting star, once a night at most, only if you are outdoors after 21:00.
function skyWatch(){
  if(state.time<21*60||state.time>=23.5*60||B().shootingDay===state.day)return;
  const t=at(Math.floor(P.x/16),Math.floor((P.y-2)/16));
  if(t===FLOOR||t===DOOR)return;
  B().shootingDay=state.day;
  if(CottageBonds.rare(B(),'shootingStar',state.day,Math.random,.05)){notify(tr('shootingStar'));sfx('levelup');}
}
// While the page was closed, the day kept going (up to 4 hours, never past 22:00).
let offlineMinutes=0;
function catchUpOffline(){
  if(!savedAtLoad)return 0;
  const seconds=(Date.now()-savedAtLoad)/1000;
  const gm=Math.min(seconds*TIME_RATE,240,Math.max(0,22*60-state.time));
  if(gm<20)return 0;
  state.time+=gm;decay(gm*.5,false);
  return gm;
}
/* Keepsake cards: a pixel frame around a scene, saved as PNG. */
function keepsakeCard(title,sub,body,art,color){
  const W=300,H=420,c=mk(W*2,H*2),g=c.getContext('2d');g.scale(2,2);g.imageSmoothingEnabled=false;
  g.fillStyle='#4a3340';g.fillRect(0,0,W,H);g.fillStyle='#fff6e8';g.fillRect(10,10,W-20,H-20);
  g.fillStyle=color||'#e2708a';
  for(let x=10;x<W-10;x+=8){g.fillRect(x,10,4,4);g.fillRect(x+4,H-14,4,4);}
  for(let y=10;y<H-10;y+=8){g.fillRect(10,y+4,4,4);g.fillRect(W-14,y,4,4);}
  let y=40;
  if(art){const s=Math.max(1,Math.floor((W-80)/art.width));g.drawImage(art,(W-art.width*s)/2,y,art.width*s,art.height*s);y+=art.height*s+30;}
  const font='"PingFang SC","Hiragino Sans","Microsoft YaHei",system-ui,sans-serif';
  g.textAlign='center';g.fillStyle='#3a2a33';g.font=`700 22px ${font}`;g.fillText(title,W/2,y);
  g.font=`12px ${font}`;g.fillStyle='#8a6a72';g.fillText(sub,W/2,y+22);
  g.font=`13px ${font}`;g.fillStyle='#4a3a40';g.textAlign='left';
  let row='',ty=y+52;
  for(const ch of String(body||'')){if(g.measureText(row+ch).width>W-70&&!'，。、！？」,.!?'.includes(ch)){g.fillText(row,35,ty);ty+=19;row=ch;if(ty>H-50)break;}else row+=ch;}
  if(row&&ty<=H-50)g.fillText(row,35,ty);
  g.textAlign='center';g.fillStyle='#a08890';g.font=`11px ${font}`;g.fillText('HomeLove',W/2,H-28);
  return c;
}
function badgeArt(a,unlocked){
  const c=mk(16,16),g=c.getContext('2d');
  const shape=['0000111111110000','0011111111111100','0111111111111110','0111111111111110','1111111111111111','1111111111111111','1111111111111111','1111111111111111',
    '1111111111111111','1111111111111111','1111111111111111','1111111111111111','0111111111111110','0111111111111110','0011111111111100','0000111111110000'];
  g.fillStyle=unlocked?a.color:'#c9bfae';
  shape.forEach((row,j)=>[...row].forEach((bit,i)=>{if(bit==='1')g.fillRect(i,j,1,1);}));
  g.fillStyle='#fff6e8';g.font='bold 10px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.fillText(unlocked?a.icon:'?',8,8.5);
  return c;
}

function chat(n){
  const r=rel(n),T=nt(n);D.npc=n;
  if(r.done.chat){talk(nm(n),[T.tired],null,()=>npcMenu(n,true));return;}
  r.done.chat=true;advanceTime(15);
  const first=state.life?.[n.id]?.firstDate;
  const recalled=NPCMemory.recall(state,n.id).find(e=>['gift','birthday','visit','rival','sharedFishing','neighborRequest','worldUfo','worldBottle','worldSeed','xiaomanConfession'].includes(e.type));
  const lines=[];
  const earlier=state.stories[n.id]?.[1];
  if(earlier&&state.day>earlier.day&&Math.random()<.4)lines.push(tr('residentRecall_'+n.id+'_'+earlier.choice));
  else if(first&&Math.random()<.4)lines.push(memoryLine(n,{interpretation:{type:'date',object:first.place}}));
  else if(recalled&&Math.random()<.4){const line=memoryLine(n,recalled);if(line)lines.push(line);}
  let gain=6+Math.round(NPCMemory.influence(state,n.id,'player'));const sc=outfitScore(n);
  if(sc>=4){lines.push(T.outfitHi);gain+=8;r.knowStyle=true;}else if(sc>=2){lines.push(T.outfitMid);gain+=4;}
  if(state.need.mood<25){lines.push(tr('tiredMood',{n:nm(n)}));gain-=3;}
  const envy=B().jealousy[n.id],trust=B().trust[n.id];
  if(envy>=50){lines.push(tr('chatJealous',{n:nm(n)}));gain-=3;}
  else if(trust>=40&&Math.random()<.35){lines.push(tr('chatTrusted',{n:nm(n)}));gain+=1;}
  const pet=petSeenBy(n);if(pet){lines.push(tr('petLiked',{n:nm(n),p:pet.name}));gain+=4;note(n,'pet_'+pet.kind,12);}
  const friends=xiaomanRoute(n)&&state.xiaoman.answer==='friends';
  lines.push(friends?tr('xmFriendChat'):pick(r.couple?T.chatCouple:T.chat[Math.min(2,Math.floor(hearts(r)/3))]));
  const after=()=>{addPts(n,gain);state.need.mood=clampN(state.need.mood+5);updateHud();milestone(n);};
  if(!friends&&Math.random()<0.55){const qi=Math.floor(Math.random()*T.questions.length),q=T.questions[qi];
    talk(nm(n),lines.concat([q.q]),q.opts.map(([label,reply],oi)=>({label,fn:()=>{gain+=n.qv[qi][oi];D.npc=n;talk(nm(n),[reply],null,after);}})));}
  else talk(nm(n),lines,null,after);
}

const residentChapter=(id,index)=>Lp.residentStories[id][index];
function openResidentStory(n,index){
  const r=rel(n);
  if(ResidentStories.next(state.stories,n.id,state.day,hearts(r))!==index)return;
  const [,intro,choices,firstReply,secondReply]=residentChapter(n.id,index);
  const lines=[intro];
  if(index===2)lines.unshift(tr('residentRecall_'+n.id+'_'+state.stories[n.id][1].choice));
  const replies=[firstReply,secondReply];
  D.npc=n;
  const opts=choices.map((label,choice)=>({label,fn:()=>{
    if(!ResidentStories.complete(state.stories,n.id,state.day,hearts(r),index,choice))return;

    addPts(n,3);updateHud();
    D.npc=n;talk(nm(n),[replies[choice]]);
  }}));

}

/* ---------------- Xiaoman’s story ---------------- */
function xiaomanRoute(n){
  return n.id==='xm'&&!rel(n).couple&&!rel(n).livesIn;
}
function xiaomanScene(n){
  if(!xiaomanRoute(n)||!rel(n).met)return null;
  return XiaomanStory.next(state.xiaoman,state.day,hearts(rel(n)));
}
function startXiaomanScene(n,scene){
  if(xiaomanScene(n)!==scene)return;
  const story=state.xiaoman;
  story.offered=state.day;
  n.path=null;n.idle=20;n.seekingPlayer=false;
  D.npc=n;save();
  const choices=scene==='confession'?[
    {label:tr('xmChooseFriends'),fn:()=>finishXiaoman(n,'friends')},
    {label:tr('xmChooseSpace'),fn:()=>finishXiaoman(n,'space')}
  ]:[
    {label:tr('xmAccept_'+scene),fn:()=>{
      story[scene]=state.day;
      const dialogue=()=>{D.npc=n;talk(nm(n),[tr('xmScene_'+scene)]);};
      if(scene==='flowers'){
        busyFade(()=>{
          Object.assign(P,{x:19*16+8,y:7*16+12,dir:'up'});
          Object.assign(n,{x:20*16+8,y:7*16+12,dir:'up',state:'here',path:null,leaving:false,moving:false,idle:20});
          snapPets();addPts(n,5);updateHud();
        },dialogue);
      }else{addPts(n,5);updateHud();dialogue();}
    }}
  ];
  choices.push({label:tr('xmLater'),back:true,fn:()=>say(nm(n),tr('xmWait'))});
  talk(nm(n),scene==='confession'?[tr('xmConfess1'),tr('xmConfess2')]:[tr('xmInvite_'+scene)],choices);
}
function finishXiaoman(n,answer){
  const story=state.xiaoman;
  if(story.answer)return;
  story.answer=answer;story.answered=state.day;
  if(state.neighborRequest?.resident==='xm'&&['offered','accepted'].includes(state.neighborRequest.status))state.neighborRequest=null;
  rememberPlayer(n,'xiaomanConfession',answer,-.35,100,answer);
  n.state='away';n.path=null;n.x=n.y=-100;
  save();updateHud();
  D.npc=n;talk(nm(n),[tr('xmPlayer_'+answer),tr('world_xmConfession_'+answer)]);
}

/* ---------------- cottage events ---------------- */
function updateNightVisitor(){
  const {landing}=CottageEvents;
  if(state.day<2||state.time<landing.start||state.time>=landing.end||FISH.on)return;
  const tile=at(Math.floor(P.x/16),Math.floor((P.y-2)/16));
  if(tile===FLOOR||tile===DOOR)return;
  const ufo=state.events.ufo;
  if(ufo.checked===state.day||ufo.done)return;
  if(CottageEvents.discover(state.events,'ufo',state.day,Math.random())){
    ufo.minute=state.time;
    sfx('ding');notify(tr('worldUfoArrival'));
  }
  save();
}
function visitorTarget(){
  if(!CottageEvents.landed(state.events,state.day,state.time))return null;
  const {x,y}=CottageEvents.landing;
  if(state.time-state.events.ufo.minute<4||Math.hypot(x-P.x,y-P.y)>22)return null;
  return {kind:'visitor',verb:tr('worldUfoTalk'),x,y:y-20};
}
let visitorDeparture=-1;
function visitAlien(){
  const flower='flower',fish=['fish','carp','moonfish'].find(k=>state.inv[k]>0);
  const choices=[
    {label:tr('worldUfoFlower'),disabled:state.inv.flower<1,fn:()=>finishVisit('flower',flower)},
    {label:tr('worldUfoFish',{fish:fish?itemLabel(fish):itemLabel('fish')}),disabled:!fish,fn:()=>finishVisit('fish',fish)},
    {label:tr('worldUfoSit'),fn:()=>finishVisit('sit')},
    {label:tr('walkAway'),fn:null}
  ];
  talk(tr('worldVisitor'),[tr('worldUfoIntro')],choices);
}
function finishVisit(choice,item){
  if(item&&state.inv[item]<1)return;
  if(!CottageEvents.finish(state.events,'ufo',state.day,choice))return;
  if(item)state.inv[item]--;
  if(choice==='fish')state.inv.shell++;
  state.need.mood=clampN(state.need.mood+8);
  visitorDeparture=absMin();save();updateHud();sfx('ding');
  talk(tr('worldVisitor'),[tr('world_ufo_'+choice)]);
}
function drawNightVisitor(g,time){
  const landed=CottageEvents.landed(state.events,state.day,state.time);
  const lift=absMin()-visitorDeparture;
  const departing=visitorDeparture>=0&&lift>=0&&lift<6;
  if(!landed&&!departing)return;
  const {x,y}=CottageEvents.landing;
  const elapsed=state.time-state.events.ufo.minute;
  const height=landed?Math.max(0,4-elapsed)*13:lift*12;
  const open=landed&&elapsed>=4;
  const sy=Math.round(y-26-height);
  g.fillStyle='#8ac3c9';g.fillRect(x-17,6*16+6,21,1);g.fillRect(x-12,6*16+9,16,1);
  if(landed){
    glow(g,x,sy+7,24,'rgba(166,225,214,.28)');
    if(open){g.fillStyle='rgba(181,231,205,.18)';g.fillRect(x-11,sy+4,18,20);}
  }
  CottageEvents.ship(g,x-11,sy,open);
  if(open)CottageEvents.alien(g,x,y+(Math.sin(time*2)>0?0:1));
}
function worldNpcOptions(n,back){
  const {ufo,bottle,seed}=state.events;
  const opts=[];
  if(n.id==='by'&&ufo.done&&state.day>ufo.done&&!ufo.told){
    opts.push({label:tr('worldTellBai'),fn:()=>{
      ufo.told=state.day;
      rememberPlayer(n,'worldUfo',ufo.choice,.8,90,ufo.choice);
      save();talk(nm(n),[tr('worldBaiReply')]);
    }});
  }
  if(n.id!=='xm')return opts;
  if(bottle.found&&!bottle.done)opts.push({label:tr('worldBottleTalk'),fn:()=>bottleMenu(n)});
  if(!back&&!seed.found&&seed.checked!==state.day&&state.day>=2&&state.time>=9*60&&state.time<15*60){
    if(CottageEvents.discover(state.events,'seed',state.day,Math.random()))notify(tr('worldSeedOfferHint'));
    save();
  }
  if(seed.found&&!seed.accepted)opts.push({label:tr('worldSeedOffer'),fn:()=>{
    seed.accepted=state.day;
    save();talk(nm(n),[tr('worldSeedGift')]);
  }});
  return opts;
}
function bottleMenu(n){
  talk(nm(n),[tr('worldBottleIntro')],[
    {label:tr('worldBottleDeliver'),fn:()=>resolveWorldEvent(n,'bottle','deliver')},
    {label:tr('worldBottleReply'),fn:()=>resolveWorldEvent(n,'bottle','reply')},
    {label:tr('optBack'),back:true,fn:()=>npcMenu(n,true)}

function openWeekendStall(items=[]){
  const title=tr('weekStall');
  if(!VillageWeekend.selling(state.day,state.time)||state.weekend.sale?.day===state.day){
    talk(title,[tr(state.weekend.sale?.day===state.day?'weekAlreadySold':'weekStallHours')]);return;
  }
  const total=items.reduce((sum,item)=>sum+VillageWeekend.price(item,state.day),0);
  const opts=[];
  if(items.length)opts.push({label:tr('weekSell',{total}),fn:()=>sellWeekendStall(items)});
  if(items.length<3){
    for(const item of Object.keys(VillageWeekend.prices)){
      const available=state.inv[item]-items.filter(i=>i===item).length;
      if(available>0)opts.push({label:tr('weekSlot',{item:itemLabel(item),price:VillageWeekend.price(item,state.day),available}),fn:()=>openWeekendStall([...items,item])});
    }
  }
  if(items.length)opts.push({label:tr('weekUndo'),fn:()=>openWeekendStall(items.slice(0,-1))});
  opts.push({label:tr('walkAway'),back:true,fn:null});
  talk(title,[tr('weekStock',{items:items.map(itemLabel).join(' · ')||tr('weekEmpty'),count:items.length})],opts);
}
function sellWeekendStall(items){
  const before=state.weekend;
  state.weekend=VillageWeekend.load(before,state.day);
  const total=VillageWeekend.sell(state.weekend,state.inv,state.day,state.time,items);
  if(!total){state.weekend=before;openWeekendStall();return;}
  if(!save()){
    state.weekend=before;
    for(const item of items)state.inv[item]++;
    state.inv.shell-=total;
    talk(tr('weekStall'),[tr('villageTradeFailed')]);return;
  }
  updateHud();sfx('pickup');
  const special=VillageWeekend.demand(state.day)[0];
  talk(tr('weekStall'),[tr('weekSold',{total}),...(items.includes(special)?[tr('weekCoffeeHint',{item:itemLabel(special)})]:[])]);
}

function findTarget(){
  const visitor=visitorTarget();
  if(visitor)return visitor;
  const d=DV[P.dir],fx=P.x+d[0]*12,fy=P.y-3+d[1]*12;
  for(const n of npcs){if(n.state!=='away'&&Math.hypot(n.x-fx,n.y-4-fy)<13)return {kind:'npc',n,verb:tr('talkTo',{n:nm(n)}),x:n.x,y:n.y-31};}
  const pt=petAt(fx,fy);if(pt)return {kind:'pet',p:pt,verb:tr('petVerb',{p:pt.name}),x:pt.x,y:pt.y-20};
  if(Math.hypot(cat.x-fx,cat.y-4-fy)<13)return {kind:'cat',verb:tr('petCat'),x:cat.x,y:cat.y-20};
  const tx=Math.floor(fx/16),ty=Math.floor(fy/16),mx=Math.floor(P.x/16),my=Math.floor((P.y-2)/16);
  for(const [kind,[x,y]] of visibleRiverClues()){
    if(((tx===x&&ty===y)||(mx===x&&my===y)))return {kind:'riverClue',id:kind,verb:tr('riverFind_'+kind),x:x*16+8,y:y*16-3};
  }
  const winter=CottageActivities.seasonOf(state.day)==='winter';
  const fl=!winter&&flowers.find(f=>!f.picked&&((f.tx===tx&&f.ty===ty)||(f.tx===mx&&f.ty===my)));

    rect(-7,-12,5,4,'#ba8459');rect(-3,-13,6,2,'#d6a579');
    const note=Math.floor(t*2)%6;rect(8,-20-note,3,2,'#e7c5e7');rect(10,-24-note,1,5,'#e7c5e7');
  }else{
    rect(6,-11,5,4,'#f2dfbd');rect(7,-10,3,1,'#8da5bc');
  }
}
function drawTunnel(g,x,y,winter){
  const r=(a,b,w,h,color)=>{g.fillStyle=color;g.fillRect(x+a,y+b,w,h);};
  r(0,7,16,8,'rgba(150,220,211,.26)');
  r(1,5,14,2,'rgba(198,239,234,.66)');
  r(4,3,8,2,'rgba(214,244,238,.82)');
  r(0,7,1,8,'#5f8e88');r(15,7,1,8,'#5f8e88');
  r(1,13,3,2,'#5f8e88');r(12,13,3,2,'#5f8e88');
  if(winter){r(5,2,6,1,'#ffffff');r(3,4,10,1,'#e7f4f4');}
}
const reducedMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function drawSeasonParticles(g,time,winter){
  const t=reducedMotion?0:time;
  for(let i=0;i<(winter?154:43);i++){
    const x=(hash2(i,7)*MW*TILE+t*(winter?4:11))%(MW*TILE)|0;
    const y=(hash2(i,13)*MH*TILE+t*(7+hash2(i,31)*7))%(MH*TILE)|0;
    const tile=at(x>>4,y>>4);
    if(tile===FLOOR||tile===DOOR||tile===WALL||tile===WALLF)continue;
    g.fillStyle=winter?(i%3===0?'#d5e6f1':'#fbfdf8'):(i%2===0?'#d89248':'#b87043');
    g.fillRect(x,y,i%3===0?2:1,1);
  }
}
function drawRiverClue(g,kind,x,y,time){
  const R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h);};
  if(kind==='apron'){
    R(-4,-3,8,5,'#65464a');R(-3,-3,6,4,'#c8b0a2');R(-2,-5,4,3,'#65464a');R(-1,-4,2,2,'#d8c1ab');R(-2,-1,3,1,'#b97971');
  }else{
    R(-2,-2,5,4,'#4b5b69');R(-1,-2,3,3,'#7bb7b7');R(-1,-2,1,1,'#f5eed1');
    if(Math.sin(time*2)>.4)R(3,-4,1,1,'#fff4cf');
  }
}
function drawRiverWeather(g,time,weather){
  if(weather==='clear'||reducedMotion)return;
  for(let i=0;i<96;i++){
    const x=(hash2(i,51)*MW*TILE+time*(weather==='rain'?27:43))%(MW*TILE)|0;
    const y=(hash2(i,83)*MH*TILE+time*(weather==='rain'?101:6))%(MH*TILE)|0;
    const tile=at(x>>4,y>>4);
    if(tile===FLOOR||tile===DOOR||tile===WALL||tile===WALLF)continue;
    g.fillStyle=weather==='rain'?'rgba(196,223,224,.63)':'rgba(255,238,185,.58)';
    g.fillRect(x,y,weather==='rain'?1:2,weather==='rain'?5:1);
  }
}
function render(time){
  updateMiniMap();
  ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#2a2230';ctx.fillRect(0,0,cv.width,cv.height);
  const S=scale,vw=cv.width/S,vh=cv.height/S,dark=darkness();
  const [cx,cy]=cameraOrigin();
  ctx.setTransform(S,0,0,S,-cx*S,-cy*S);ctx.imageSmoothingEnabled=false;
  const season=CottageActivities.seasonOf(state.day),art=SEASON_ART[season],winter=season==='winter';
  ctx.drawImage(art.ground,0,0);
  if(walkRoute.length){
    const [x,y]=walkRoute.at(-1).map(Math.round);
    ctx.fillStyle='#704844';ctx.fillRect(x-4,y-4,8,4);
    ctx.fillStyle='#ffe1a2';ctx.fillRect(x-3,y-3,6,2);
  }
  if(!winter)for(const [x,y] of waterTiles){const h=hash2(x,y);if(Math.sin(time*1.6+h*40)>0.82){ctx.fillStyle='#e2f6fc';ctx.fillRect(x*16+3+(h*8|0),y*16+4+(hash2(y,x)*8|0),3,1);}}
  if(VillageRiverside.exposed(state.day)){
    const [x,y]=VillageRiverside.glassTile;
    VillageMap.tile(ctx,x*16,y*16,'stone',false);
  }
  for(const [kind,[x,y]] of visibleRiverClues()){
    drawRiverClue(ctx,kind,x*16+8,y*16+10,reducedMotion?0:time);
  }
  drawWindows(ctx,dark>0.5);
  state.garden.forEach((plot,i)=>{
    if(!plot)return;
    const x=(17+i%6)*16,y=(13+Math.floor(i/6))*16;
    if(plot.watered){
      ctx.fillStyle='rgba(65,45,58,.26)';ctx.fillRect(x+1,y+2,14,12);
      ctx.fillStyle='#89c7df';ctx.fillRect(x+12,y+10,1,2);
    }
    if(plot.crop==='mysteryBloom'&&CottageActivities.ripe(plot)){
      CottageEvents.bloom(ctx,x+8,y+3);return;
    }
    const sprout=CottageActivities.ripe(plot)
      ?SPR[plot.crop==='berry'?'berryRipe':plot.crop]
      :plot.growth?SPR.berryLeaf:SPR.sprout;
    ctx.drawImage(sprout,x,y);
  });
  for(const i of state.tunnels){
    const x=(17+i%6)*16,y=(13+Math.floor(i/6))*16;
    drawTunnel(ctx,x,y,winter);
  }
  if(!winter)for(const f of flowers)if(!f.picked){const sway=Math.sin(time*2+f.tx)>0.6?1:0;ctx.drawImage(SPR.flower[f.col],f.tx*16+sway,f.ty*16);}
  if(FISH.on&&FISH.snow){
    const rival=FISH.snow,xy=snowResident();
    ctx.strokeStyle='#b0bac3';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(xy.x,xy.y-12);
    ctx.lineTo(xy.x,6*16+8);ctx.stroke();
    ctx.fillStyle=rival.elapsed>=rival.rival?'#ffe89d':'#ce815e';
    ctx.fillRect(xy.x-1,6*16+7,2,2);
  }
  if(FISH.on&&FISH.phase!=='snowWait'){const bx=FISH.tx*16+8,by=FISH.ty*16+8+(FISH.phase==='bite'?2:(Math.sin(time*3)>0?1:0));
    ctx.strokeStyle='rgba(255,245,216,.65)';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(P.x,P.y-12);ctx.lineTo(bx,by);ctx.stroke();
    ctx.fillStyle='#2a1e24';ctx.fillRect(bx-2,by-2,5,5);ctx.fillStyle='#ffffff';ctx.fillRect(bx-1,by-1,3,1);ctx.fillStyle='#e8384f';ctx.fillRect(bx-1,by,3,2);
    if(FISH.phase==='bite'){ctx.fillStyle='#e2f6fc';ctx.fillRect(bx-5,by+3,3,1);ctx.fillRect(bx+3,by+3,3,1);}}
  const ents=[];
  for(const prop of VillageMap.props){
    const x=prop.x*16,y=(prop.y+prop.h)*16;
    if(x+prop.w*16>cx&&x<cx+vw&&y>cy&&y-52<cy+vh)
      ents.push({key:y-1,draw:g=>VillageMap.paintProp(g,prop,winter,dark>.5,time)});
  }
  for(const s of statics)if(s.x+s.w>cx&&s.x<cx+vw&&s.y+s.h>cy&&s.y<cy+vh)ents.push(s);
  ents.push({key:P.y,draw:g=>{
    const ride=activeRide();
    if(ride)CottageTravel.paint(g,ride,P.x,P.y,P.dir,false);
    if(ride!=='car')drawPerson(g,state.o,P.dir,!ride&&P.moving?WALK[Math.floor(P.anim*7)%4]:0,P.x,P.y-(ride?2:0));
    if(ride)CottageTravel.paint(g,ride,P.x,P.y,P.dir,true);
    if(FISH.on&&FISH.phase==='bite'){
      const x=Math.round(P.x)-9,y=Math.round(P.y)-29;
      drawBang(g,P.x,P.y-39,'#ff6b6b');
      g.fillStyle='#44342d';g.fillRect(x,y,18,4);
      g.fillStyle='#ffcf67';g.fillRect(x+1,y+1,Math.ceil(16*FISH.t/FISH.window),2);
    }
  }});
  for(const n of npcs){if(n.state==='away')continue;ents.push({key:n.y,draw:g=>{drawPerson(g,n.outfit,n.dir,n.moving?WALK[Math.floor(n.anim*6)%4]:0,n.x,personY(n,time));drawChoreProps(g,n,time);drawVillageWork(g,n,time);
    const r=rel(n);if(r.couple)drawHeart(g,n.x,n.y-33+(Math.sin(time*3)>0?-1:0),0.95);else if(!r.met)drawBang(g,n.x,n.y-36+(Math.sin(time*4)>0?-1:0));}});}
  for(const p of state.pets)ents.push({key:p.y,draw:g=>drawPet(g,p,time)});
  if(!state.goldFound){const gx=GOLD_TILE[0]*16+8,gy=GOLD_TILE[1]*16+12;ents.push({key:gy,draw:g=>{const b=Math.sin(time*3)>0?-1:0;g.fillStyle='rgba(40,30,30,.18)';g.fillRect(gx-4,gy-1,8,2);g.drawImage(SPR.gold,gx-6,gy-15+b);
    const tw=(Math.sin(time*5)+1)/2;g.fillStyle=`rgba(255,250,200,${tw.toFixed(2)})`;g.fillRect(gx-8,gy-17,1,3);g.fillRect(gx-9,gy-16,3,1);g.fillRect(gx+7,gy-8,1,3);g.fillRect(gx+6,gy-7,3,1);}});}
  ents.push({key:cat.y,draw:g=>{
    const x=Math.round(cat.x),y=Math.round(cat.y),s=cat.state==='walk'?SPR.catW[Math.floor(cat.anim*6)%2]:SPR.catSit;
    g.fillStyle='rgba(40,30,30,.2)';g.fillRect(x-5,y-1,10,2);
    if(cat.dir<0){g.save();g.translate(x+9,y-14);g.scale(-1,1);g.drawImage(s,0,0);g.restore();}else g.drawImage(s,x-9,y-14);
  }});
  ents.sort((a,b)=>a.key-b.key);for(const e of ents)e.draw(ctx,art);
  if(readyVehicles().length||unreadAlbumPostcard()||hasNeighborMail()){
    const x=7*16+4,y=10*16-16+(Math.sin(time*4)>0?1:0);
    ctx.fillStyle='#714c48';ctx.fillRect(x-1,y-1,10,8);
    ctx.fillStyle='#fff1cd';ctx.fillRect(x,y,8,6);
    ctx.fillStyle='#d1917f';ctx.fillRect(x+1,y+1,2,1);ctx.fillRect(x+5,y+1,2,1);
    ctx.fillRect(x+3,y+2,2,2);
  }
  drawPuffs(ctx);
  for(const p of parts)drawHeart(ctx,p.x,p.y-p.t*14,Math.max(0,1-p.t/1.2));
  if(target&&!busy&&!dressOpen&&!diaryOpen&&!albumOpen&&!mapOpen&&!startOpen&&!D.modal&&!FISH.on)drawArrow(ctx,target.x,target.y+(Math.sin(time*6)>0?-1:0));
  if(dark>0){
    const h=state.time/60,dusk=h>=17&&h<20;
    ctx.fillStyle=dusk?`rgba(${Math.round(60-40*dark)},${Math.round(30-8*dark)},60,${(0.52*dark).toFixed(3)})`:`rgba(20,22,62,${(0.52*dark).toFixed(3)})`;
    ctx.fillRect(cx,cy,vw,vh);
    ctx.globalCompositeOperation='lighter';
    for(const lamp of VillageMap.props)if(lamp.id==='lamp'){
      const x=lamp.x*16+8,y=lamp.y*16-5;
      if(x>cx-25&&x<cx+vw+25&&y>cy-25&&y<cy+vh+25)glow(ctx,x,y,28,'rgba(255,204,128,.26)');
    }
    if(state.lamp){glow(ctx,LAMP_POS[0],LAMP_POS[1]-8,72,`rgba(255,190,100,${(0.3*dark).toFixed(3)})`);glow(ctx,LAMP_POS[0],LAMP_POS[1]-14,16,`rgba(255,220,140,${(0.35*dark).toFixed(3)})`);}
    if(dark>0.5){glow(ctx,6*16+8,2*16+9,14,'rgba(150,170,255,0.15)');glow(ctx,9*16+8,2*16+9,14,'rgba(150,170,255,0.15)');glow(ctx,14*16+8,2*16+9,14,'rgba(150,170,255,0.15)');
      state.garden.forEach((plot,i)=>{
        if(plot?.crop==='mysteryBloom'&&CottageActivities.ripe(plot)){
          const x=(17+i%6)*16+8,y=(13+Math.floor(i/6))*16+5;
          glow(ctx,x,y,12,'rgba(255,211,151,.34)');
          ctx.fillStyle='#fff0bc';ctx.fillRect(x,y,1,1);
        }
      });
      if(!winter)for(const f of fireflies){const fx=f.x+Math.sin(time*f.s+f.p)*10,fy=f.y+Math.cos(time*f.s*.7+f.p)*7,a=(Math.sin(time*2.4*f.s+f.p)+1)/2*dark;
        if(a>.3){glow(ctx,fx,fy,5,`rgba(255,240,140,${(a*.5).toFixed(2)})`);ctx.fillStyle=`rgba(255,250,190,${a.toFixed(2)})`;ctx.fillRect(Math.round(fx),Math.round(fy),1,1);}}}
    ctx.globalCompositeOperation='source-over';
    drawNightVisitor(ctx,time);
  }
  if(winter||season==='autumn')drawSeasonParticles(ctx,time,winter);
  drawRiverWeather(ctx,time,VillageRiverside.weather(state.day));
}

/* ---------------- loop ---------------- */
let hudT=0,saveT=0,stepT=0,bondsT=0;
function update(dt){
  const paused=startOpen||dressOpen||diaryOpen||albumOpen||mapOpen||D.modal||busy;
  let dx=0,dy=0;
  if(paused||FISH.on)walkRoute=[];
  if(!paused&&!FISH.on){
    if(has('ArrowLeft','KeyA','left'))dx-=1;if(has('ArrowRight','KeyD','right'))dx+=1;
    if(has('ArrowUp','KeyW','up'))dy-=1;if(has('ArrowDown','KeyS','down'))dy+=1;
  }
  const ride=activeRide(),speed=ride?CottageTravel.catalog[ride].speed:1;
  const sp=64*(state.need.energy<15?0.6:1)*speed*dt;
  let moving=false;
  if(dx||dy){
    walkRoute=[];
    if(dx&&dy){const hd=dx<0?'left':'right',vd=dy<0?'up':'down';if(P.dir!==hd&&P.dir!==vd)P.dir=hd;}
    else P.dir=dx<0?'left':dx>0?'right':dy<0?'up':'down';
    const len=Math.hypot(dx,dy);moveBy(dx/len*sp,dy/len*sp);moving=true;
  }else if(walkRoute.length)moving=followWalkRoute(sp);
  P.moving=moving;
  if(moving){
    P.anim+=dt;
    stepT+=dt;if(stepT>0.3){stepT=0;const tt=at(Math.floor(P.x/16),Math.floor((P.y-2)/16));sfx('step',tt===FLOOR||tt===DOOR);}
  }else P.anim=0;
  if(!paused){
    const gm=dt*TIME_RATE;state.time+=gm;decay(gm,P.moving);
    updateNightVisitor();
    checkSnowKnock();
    skyWatch();
    bondsT+=dt;if(bondsT>2){bondsT=0;bondsTick();}
    updFish(dt);
    if(state.time>=26*60||state.need.energy<=0){FISH.on=false;FISH.companion=null;FISH.snow=null;passOut();}
  }
  updCat(dt);
  updPets(paused?0:dt);
  if(!paused)checkChores();
  updPuffs(paused?0:dt);
  if(!startOpen)for(const n of npcs)updNpc(n,paused&&!busy?0:dt);
  for(let i=parts.length-1;i>=0;i--){parts[i].t+=dt;if(parts[i].t>1.2)parts.splice(i,1);}
  target=findTarget();updatePrompt();
  hudT+=dt;if(hudT>.25){hudT=0;updateHud();}
  saveT+=dt;if(saveT>5){saveT=0;save();}
  if(dressOpen&&pWalk){pTimer+=dt;if(pTimer>.18){pTimer=0;pFrame=(pFrame+1)%4;drawPreview();}}
}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);render(t/1000);requestAnimationFrame(loop);}
// Start of session: yesterday's baseline, today's possible visitor, and the hours that passed while the page was closed.
if(!B().dayStart)CottageBonds.startDay(B(),state.day,ptsMap());
planToday();
offlineMinutes=catchUpOffline();
if(!SaveManager.snapshots(localStorage,LS).some(s=>s.label==='d-'+state.day))snapshotMorning();
applyLang();
snapPets();
requestAnimationFrame(loop);
$('#btnStart').focus();
})();
</script>
