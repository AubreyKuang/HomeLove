<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>像素小屋 · HomeLove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Silkscreen&family=DotGothic16&family=Pixelify+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css?v=day-plans-1">
</head>
<body>

<canvas id="game" tabindex="0" data-i18n-aria="title"></canvas>
<div id="lanternReaction" class="px hidden" role="status" aria-live="polite"></div>

<div id="hud">
  <div id="hudStats">
  <div class="chip" id="chipTime">☀️</div>
  <div class="chip">
    <span class="bar" id="barE">⚡<i><b id="bE"></b></i></span>
    <span class="bar" id="barH">🍙<i><b id="bH"></b></i></span>
    <span class="bar" id="barM">💗<i><b id="bM"></b></i></span>
  </div>
  <div class="chip" data-i18n-title="bagTitle">🎒<span class="n" id="cBag">0</span></div>
  </div>
  <button class="px" id="miniMap" type="button" aria-controls="villageMap" data-i18n-aria="miniMapLabel" data-i18n-title="villageMap">
    <canvas id="miniOverview" width="192" height="136" aria-hidden="true"></canvas>
    <span id="miniRide" class="hidden"></span>
  </button>
</div>
<div id="hudR">
  <button class="pbtn hidden" id="btnUmbrella" type="button" aria-keyshortcuts="U" title="U"></button>
  <button class="pbtn primary" id="btnWardrobe" type="button" data-i18n="btnWardrobe"></button>
  <button class="pbtn" id="btnAlbum" type="button" data-i18n="btnAlbum"></button>
  <button class="pbtn" id="btnDiary" type="button" data-i18n="btnDiary"></button>
  <details id="cottageMenu">
    <summary data-i18n-aria="moreActions">···</summary>
    <div class="cottage-menu-items">
      <button class="pbtn" id="btnMap" type="button" data-i18n="villageMap"></button>
      <button class="pbtn" id="btnTravel" type="button" data-i18n="travelShop"></button>
      <button class="pbtn" id="btnLang" type="button" data-i18n-aria="language"></button>
      <button class="pbtn" id="btnSound" type="button" data-i18n-aria="sound">🔊</button>
      <button class="pbtn" id="btnHelp" type="button" data-i18n="help"></button>
    </div>
  </details>
</div>

<div id="prompt" class="px hidden"></div>
<div id="villageGuide" class="hidden">
  <span id="villageGuideText" role="status"></span>
  <button id="firstGreetingDismiss" type="button" class="hidden" data-i18n="firstGreetingDismiss"></button>
  <button id="villageRouteCancel" type="button" class="hidden" data-i18n-aria="villageRouteCancel" data-i18n-title="villageRouteCancel">×</button>
</div>
<button class="pbtn" id="fishCancel" type="button" data-i18n="fishCancel" hidden></button>
<div id="toast" class="px hidden" role="status" aria-live="polite"></div>
<div id="dialog" class="px hidden" aria-live="polite"><div class="who"></div><div class="txt"></div><div class="choices"></div><div class="more">▼</div></div>

<div id="pad" aria-hidden="true">
  <button class="u" data-k="up" type="button">▲</button>
  <button class="l" data-k="left" type="button">◀</button>
  <button class="r" data-k="right" type="button">▶</button>
  <button class="d" data-k="down" type="button">▼</button>
</div>
<button id="abtn" type="button" data-i18n-aria="interact">A</button>

<div id="dress" class="overlay hidden" role="dialog" aria-modal="true" data-i18n-aria="wardrobe">
  <div class="dpanel px">
    <div class="dhead">
      <h2><span data-i18n="wardrobe"></span><small data-i18n="wardrobeHint"></small></h2>
      <button class="pbtn" id="dClose" type="button" data-i18n="dressDone"></button>
    </div>
    <div class="dbody">
      <section class="stage">
        <div class="stagebox"><canvas id="preview" width="20" height="26"></canvas></div>
        <div class="stagectl">
          <div class="rot">
            <button class="pbtn" id="rotL" type="button" data-i18n-aria="turnL">◀</button>
            <span id="rotLabel"></span>
            <button class="pbtn" id="rotR" type="button" data-i18n-aria="turnR">▶</button>
          </div>
          <div class="row">
            <button class="pbtn" id="btnWalk" type="button"></button>
            <button class="pbtn" id="btnRandom" type="button" data-i18n="random"></button>
            <button class="pbtn" id="btnSave" type="button" data-i18n="saveLook"></button>
          </div>
          <div class="looksWrap">
            <div class="lbl" data-i18n="myLooks"></div>
            <div class="looks" id="looks"></div>
          </div>
        </div>
      </section>
      <section class="picker">
        <nav class="tabs" id="tabs" data-i18n-aria="catsAria"></nav>
        <div class="items" id="items"></div>
        <div id="colorsWrap">
          <div class="lbl" data-i18n="color"></div>
          <div class="colors" id="colors"></div>
        </div>
      </section>
    </div>
  </div>
</div>

<dialog id="villageMap" class="overlay" aria-labelledby="villageMapTitle">
  <div class="dpanel px village-panel">
    <div class="dhead"><h2 id="villageMapTitle" data-i18n="villageMap"></h2><button class="pbtn" id="villageClose" type="button" data-i18n="close" autofocus></button></div>
    <div class="village-body">
      <div class="village-preview">
        <canvas id="villageOverview" width="192" height="136" aria-hidden="true"></canvas>
        <p data-i18n="villageChooseRoute"></p>
      </div>
      <div id="villageStops"></div>
    </div>
  </div>
</dialog>

<div id="diary" class="overlay hidden" role="dialog" aria-modal="true" data-i18n-aria="diary">
  <div class="dpanel px diarypanel">
    <div class="dhead">
      <h2><span data-i18n="diary"></span><small id="diarySub"></small></h2>
      <button class="pbtn" id="diaryClose" type="button" data-i18n="close"></button>
    </div>
    <div class="diarybody" id="diaryBody"></div>
  </div>
</div>

<div id="album" class="overlay hidden" role="dialog" aria-modal="true" data-i18n-aria="albumTitle">
  <div class="dpanel px diarypanel">
    <div class="dhead">
      <h2 data-i18n="albumTitle"></h2>
      <button class="pbtn" id="albumClose" type="button" data-i18n="close"></button>
    </div>
    <div class="album-body" id="albumBody"></div>
  </div>
</div>

<div id="start" class="overlay" role="dialog" aria-modal="true" data-i18n-aria="title">
  <div class="card px">
    <div class="langpick" id="langPick" role="group" data-i18n-aria="language"></div>
    <h1 data-i18n="title"></h1>
    <p class="start-lead" data-i18n="startLead"></p>
    <p class="start-detail" data-i18n="intro1"></p>
    <p class="start-detail" data-i18n="intro2"></p>
    <div class="keys">
      <span class="k"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd></span><span id="moveHelp"></span>
      <span class="k"><kbd>E</kbd><kbd data-i18n="space"></kbd></span><span data-i18n="kAct"></span>
      <span class="k"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd></span><span data-i18n="kChoose"></span>
      <span class="k"><kbd>C</kbd><kbd>J</kbd><kbd>B</kbd><kbd>L</kbd></span><span data-i18n="kMenus"></span>
      <span class="k"><kbd>M</kbd></span><span data-i18n="kSound"></span>
      <span class="k"><kbd>A</kbd></span><span data-i18n="kTouch"></span>
    </div>
    <button class="pbtn primary" id="btnStart" type="button"></button>
  </div>
</div>
<div id="fade"></div>

<script src="npc-memory.js"></script>
<script src="save-manager.js?v=save-recovery-1"></script>
<script src="cottage-activities.js?v=request-choices-1"></script>
<script src="cottage-events.js?v=snow-fishing-1"></script>
<script src="cottage-bonds.js?v=bonds-1"></script>
<script src="memory-album.js?v=cafe-request-1"></script>
<script src="resident-stories.js?v=quiet-moments-1"></script>
<script src="village-map.js?v=day-plans-1"></script>
<script src="cottage-travel.js?v=umbrella-1"></script>
<script src="village-weekend.js"></script>
<script src="village-riverside.js"></script>
<script src="village-projects.js"></script>
<script src="village-blackout.js?v=rare-nights"></script>
<script src="lang/zh.js?v=rain-postpone-1" charset="utf-8"></script>
<script src="lang/en.js?v=rain-postpone-1" charset="utf-8"></script>
<script src="lang/ja.js?v=rain-postpone-1" charset="utf-8"></script>

<script src="js/core.js"></script>
<script src="js/wardrobe-art.js"></script>
<script src="js/audio.js"></script>
<script src="js/state.js?v=date-shelter-1"></script>
<script src="js/world-map.js?v=market-lunch-1"></script>
<script src="js/world-art.js"></script>
<script src="js/residents.js?v=date-shelter-1"></script>
<script src="js/dialogue.js"></script>
<script src="js/daily-life.js?v=lunch-return-1"></script>
<script src="js/fishing.js?v=day-plans-1"></script>
<script src="js/relationships.js?v=rain-postpone-1"></script>
<script src="js/interaction.js?v=lunch-return-1"></script>
<script src="js/hud.js?v=day-plans-1"></script>
<script src="js/input.js?v=day-plans-1"></script>
<script src="js/wardrobe.js"></script>
<script src="js/diary.js?v=rain-postpone-1"></script>
<script src="js/album.js?v=cafe-request-1"></script>
<script src="js/render.js?v=village-route-1"></script>
<script src="js/main.js?v=day-plans-1"></script>
</body>
</html>
